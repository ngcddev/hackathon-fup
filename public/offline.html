<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; background: #fff; color: #000; text-align: center; padding: 24px; }
      main { max-width: 28rem; }
      h1 { font-size: 1.75rem; margin: 0 0 12px; }
      p { font-size: 1.125rem; line-height: 1.5; margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; padding: 12px 24px; border: 2px solid #000; background: #000;
        color: #fff; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No hay internet. Por seguridad, los datos del hospital no se guardan en este dispositivo. Vuelve a intentarlo cuando recuperes la conexión.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
